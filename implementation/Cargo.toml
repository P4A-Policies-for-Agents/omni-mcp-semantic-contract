[package]
name = "mcp_semantic_contract"
version = "1.3.0"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "82a0453b-22e6-430d-bbf4-35b989d043dc"
definition_asset_id = { name = "mcp-semantic-contract", version = "1.1.0" }
implementation_asset_id = "mcp-semantic-contract-flex"

[dependencies]
pdk = { version = "1.9.0" }
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps upstream key order intact: the policy annotates payloads,
# it must not silently reorder them.
serde_json = { version = "1.0", default-features = false, features = ["alloc", "preserve_order"] }
anyhow = "1.0"
futures = "0.3"

[dev-dependencies]
pdk-test = { version = "1.9.0" }
pdk-unit = { version = "1.9.0" }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
